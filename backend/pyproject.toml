[project]
name = "keynest-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "cryptography>=43,<45", "argon2-cffi>=23,<24",
  "pydantic-settings>=2.6,<3", "PyJWT>=2.9,<3", "email-validator>=2.2,<3"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.28,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
plugins = []

