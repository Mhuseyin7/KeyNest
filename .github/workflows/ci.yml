name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install '.[dev]' build
      - run: ruff check app tests
      # Strict typing is enforced on the security-critical pure-Python core.
      # ORM/FastAPI boundary typing is tracked separately during the migration
      # to SQLAlchemy's dedicated mypy plugin.
      - run: mypy app/config.py app/crypto.py app/envfile.py app/security.py
      - run: pytest
      - run: python -m build
  cli:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.23.x' }
      - run: go fmt ./...
      - run: go test ./...
      - run: go build ./...
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
  secret-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject obvious secret logging / wildcard credential CORS
        run: "! rg -n --glob '!README.md' --glob '!THREAT_MODEL.md' --glob '!SECURITY.md' '(?i)(console\\.log.*(secret|token)|logger\\..*(secret|token)|Access-Control-Allow-Origin:\\s*\\*)' ."
